vich_uploader:
    db_driver: orm

    mappings:
        applis:
            uri_prefix: '/%app.name%/images/applis'
            upload_destination: '%kernel.project_dir%/public/images/applis'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
            inject_on_load: true
            delete_on_update: true
            delete_on_remove: true

when@test: &test
    vich_uploader:
        mappings:
            applis:
                uri_prefix: /images/applis

when@dev: *test
