vich_uploader:
    db_driver: orm

    mappings:
        applis:
            uri_prefix: '/%app.name%/images/applis'
            upload_destination: '%kernel.project_dir%/public/images/applis'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
        users:
            uri_prefix: '/%app.name%/images/users'
            upload_destination: '%kernel.project_dir%/public/images/users'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true


when@test: &test
    vich_uploader:
        mappings:
            applis:
                uri_prefix: /images/applis
            users:
                uri_prefix: /images/users

when@dev: *test
