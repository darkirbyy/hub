vich_uploader:
    db_driver: orm

    mappings:
        applis:
            uri_prefix: '/uploads/applis'
            upload_destination: '%kernel.project_dir%/public/uploads/applis'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
        users:
            uri_prefix: '/uploads/users'
            upload_destination: '%kernel.project_dir%/public/uploads/users'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true


when@prod: &vich-prod
    vich_uploader:
        mappings:
            applis:
                uri_prefix: '/%app.name%/uploads/applis'
            users:
                uri_prefix: '/%app.name%/uploads/users'

when@stag: *vich-prod

