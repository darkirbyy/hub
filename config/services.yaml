# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.name: '%env(string:APP_NAME)%'
    app.env: '%env(string:APP_ENV)%'
    app.html_validation: '%env(bool:APP_HTML_VALIDATION)%'
    app.password_strength: '%env(enum:App\Enum\PasswordStrengthEnum:APP_PASSWORD_STRENGTH)%'
    app.enable_prefetch: '%env(bool:APP_ENABLE_PREFETCH)%'

imports:
    - { resource: 'version.yaml' }

services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    Symfony\Component\Dotenv\Command\DotenvDumpCommand: ~
    
    App\:
        resource: '../src/'

    App\Form\:
        resource: '../src/Form'
        tags: ['form.type']
        arguments:
            $htmlValidation: '%app.html_validation%'

    App\Extension\EventExtension:
        tags: [kernel.event_subscriber]

    App\Extension\TypeExtension:
        tags: [form.type_extension]

    App\Form\Account\PasswordUserType:
        arguments:
            $htmlValidation: '%app.html_validation%'
            $passwordStrength: '%app.password_strength%'